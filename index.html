<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<meta name="description" content="Plan familiar de emergencia: mochilas de 72 horas, reservas por casa, plan de comunicación y guías de qué hacer. Funciona sin conexión.">
<title>Plan Familiar de Emergencia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0a1220;--bg2:#0e1a2e;--card:#12213a;--card2:#172a48;--line:#22395e;--ink:#e6eefb;--ink2:#a9bad6;--ink3:#7086a8;
  --pri:#60a5fa;--pri2:#3b82f6;--pri-soft:#3a1420;--btn:#3b82f6;--btn-ink:#ffffff;--sos:#dc2626;
  --ok:#4ade80;--ok-soft:#10301f;--warn:#fbbf24;--warn-soft:#33270b;--bad:#f87171;
  --c-bag:#fb923c;--c-home:#38bdf8;--c-car:#a78bfa;--c-plan:#4ade80;--c-guide:#fbbf24;--c-tel:#f87171;
  --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--shadow:none;--glow:radial-gradient(ellipse at top,#16305a 0%,#0a1220 58%);
}
:root[data-theme="light"]{
  --bg:#f3f6fb;--bg2:#ffffff;--card:#ffffff;--card2:#eef3fb;--line:#d9e2ef;--ink:#0f1a2c;--ink2:#46556d;--ink3:#7a879c;
  --pri:#1d4ed8;--pri2:#2563eb;--pri-soft:#fde8e8;--btn:#1d4ed8;--btn-ink:#ffffff;--sos:#b91c1c;
  --ok:#15803d;--ok-soft:#e3f4e8;--warn:#b45309;--warn-soft:#fdf0dc;--bad:#b91c1c;
  --c-bag:#c2410c;--c-home:#0369a1;--c-car:#6d28d9;--c-plan:#15803d;--c-guide:#b45309;--c-tel:#b91c1c;
  --shadow:0 1px 2px #0000000d,0 4px 14px #00000008;--glow:linear-gradient(#f3f6fb,#f3f6fb);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(80px + var(--safe-b));background:var(--glow)}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,transparent);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
header.top .brand{flex:1;min-width:0}
header.top h1{margin:0;font-size:clamp(15.5px,4.4vw,19px);font-weight:900;letter-spacing:.01em;color:var(--pri);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top p{margin:2px 0 0;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:42px;height:42px;border-radius:12px;flex:none;display:block;box-shadow:0 2px 10px #0006}
.logo svg{width:24px;height:24px;color:#fff}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:21px;height:21px}
main{padding:4px 16px 16px}
h2.v{font-size:22px;margin:6px 2px 14px;letter-spacing:-.01em}
.sect{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--pri);margin:22px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.muted{color:var(--ink2)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 15px;font-weight:650}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* home */
.hero{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:800}
.alerts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.alert{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;border-radius:10px;padding:7px 10px}
.alert svg{width:17px;height:17px;flex:none}
.alert.bad{background:var(--pri-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;align-items:center;gap:10px;border-radius:14px;padding:14px;border:1px solid var(--line);background:var(--card);font-weight:700;text-align:left;box-shadow:var(--shadow)}
.qbtn svg{width:24px;height:24px;flex:none}
.qbtn.call{background:var(--sos);border-color:var(--sos);color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15.5px}.tile small{color:var(--ink3);font-size:12.5px}
.bar{height:7px;border-radius:5px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:650;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--ink2)}
.tabs button svg{width:17px;height:17px;color:var(--k)}
.tabs button em{font-style:normal;font-size:12px;color:var(--ink3)}
.tabs button.on{background:color-mix(in srgb,var(--k) 22%,var(--card));color:var(--ink);border-color:var(--k)}.tabs button.on em{color:var(--ink2)}
.art svg{width:100%;height:auto;display:block;border-radius:var(--r)}
.note{font-size:14px;color:var(--ink2);line-height:1.5;margin:12px 2px 8px}
.count{font-size:12.5px;color:var(--ink3);margin:6px 2px 10px}
.item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:7px}
.item.on{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.item.on .tx>span{color:var(--ink2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.chk{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--ink3);background:transparent;display:grid;place-items:center;padding:0;color:#fff}
.chk svg{width:18px;height:18px}
.item.on .chk{background:var(--ok);border-color:var(--ok)}
.tx{flex:1;min-width:0;font-size:15px;line-height:1.4}
.qty{display:inline-block;font-weight:750;color:var(--ink)}
.exp{position:relative;display:inline-block;margin-top:6px}.exp input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.xp{display:inline-block;font-size:12px;border:1px dashed var(--line);border-radius:8px;padding:2px 8px;color:var(--ink3)}
.xp.warn{border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft)}.xp.bad{border:1px solid var(--bad);color:var(--bad);background:var(--pri-soft)}
.sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
.blinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.blink{border:1px solid var(--line);background:var(--card2);color:var(--pri);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:650}
/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:600}
input.in,select.in,textarea.in{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15.5px;outline:0}
textarea.in{min-height:76px;resize:vertical;line-height:1.45}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.stepper button{width:42px;height:42px;border:0;background:transparent;font-size:20px;font-weight:700}
.stepper b{flex:1;text-align:center;font-size:16px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.switch input{width:46px;height:26px;appearance:none;background:var(--line);border-radius:999px;position:relative;transition:.2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.switch input:checked{background:var(--ok)}.switch input:checked::after{left:23px}
.hh{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--bg2)}
.hh h4{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.person{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:7px;width:100%;text-align:left}
.person .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--c-plan) 16%,transparent);color:var(--c-plan);flex:none}
.person .tx b{display:block;font-size:15px}.person .tx small{color:var(--ink3);font-size:12.5px}
/* guides */
.gcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.gcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.gcard .ic svg{width:24px;height:24px}
.gcard b{display:block;font-size:16px}.gcard small{color:var(--ink3);font-size:13px}
.phase{margin:14px 0}
.phase h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;color:var(--k)}
.phase ol{margin:0;padding-left:22px}.phase li{margin:0 0 8px;line-height:1.5;font-size:15.5px}
/* contacts */
.tel{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.tel .num{font-size:22px;font-weight:800;color:var(--c-tel);min-width:64px}
.tel .tx{flex:1}.tel .tx b{display:block}.tel .tx small{color:var(--ink3)}
.tel .call{width:42px;height:42px;border-radius:50%;background:var(--sos);color:#fff;display:grid;place-items:center;flex:none}
.tel .call svg{width:20px;height:20px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:650;color:var(--ink3);min-width:0}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--pri)}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:90;background:#0008;display:flex;align-items:flex-end;justify-content:center}
.modal .sh{background:var(--bg);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));max-height:92vh;overflow:auto}
.modal h3{margin:0 0 14px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;z-index:200;max-width:90vw;box-shadow:0 6px 20px #0004}
.foot{color:var(--ink3);font-size:12px;text-align:center;margin:26px 8px 8px;line-height:1.55}
.wiz-step{font-size:12.5px;color:var(--ink3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
/* print */
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,nav.bottom,.toast,.modal{display:none!important}
  #print{display:block;font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000}
  #print h1{font-size:18pt;margin:0 0 4pt}#print h2{font-size:13pt;margin:14pt 0 6pt;border-bottom:1.5pt solid #000;padding-bottom:2pt}
  #print table{width:100%;border-collapse:collapse;margin:4pt 0 8pt;background:#fff}
  #print th,#print td{border:1pt solid #000;padding:4pt 6pt;text-align:left;vertical-align:top;background:#fff;color:#000}
  #print th{font-weight:bold}
  #print .box{display:inline-block;width:10pt;height:10pt;border:1pt solid #000;margin-right:4pt;vertical-align:-1pt}
  #print .pb{page-break-before:always}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="bottom" id="navwrap"><div class="in" id="nav"></div></nav>
<div id="print"></div>
<input type="file" id="fpick" accept=".json,application/json" class="hidden">
<script>
'use strict';
/* ========== ÍCONOS ========== */
const I={
 shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12.5l2 2 4-4.5"/>',
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
 bag:'<path d="M6 9a6 6 0 0 1 12 0v12H6z"/><path d="M9 5V3h6v2M9 14h6M9 17h6"/>',
 car:'<path d="M4 16V12l2-5h12l2 5v4"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/><path d="M6 12h12"/>',
 plan:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
 guide:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6M9 11h6"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/>',
 print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',
 quake:'<path d="M2 12h3l2-5 3 10 3-14 3 12 2-3h4"/>',
 flood:'<path d="M2 15c2 0 2.5-2 5-2s3 2 5 2 2.5-2 5-2 3 2 5 2"/><path d="M2 19.5c2 0 2.5-2 5-2s3 2 5 2 2.5-2 5-2 3 2 5 2"/><path d="M12 3s4 4.5 4 7a4 4 0 0 1-8 0c0-2.5 4-7 4-7z"/>',
 fire:'<path d="M12 3c.5 3.5 5 5.5 5 10.5a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5.5.5 1.5 1.5 2.5 2.5 3 0-3-.5-5.5 0-8z"/>',
 drop:'<path d="M12 3s6 7 6 11.5a6 6 0 0 1-12 0C6 10 12 3 12 3z"/><path d="M4 4l16 16"/>',
 bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
 road:'<path d="M5 21L9 3M19 21L15 3M12 5v2M12 11v2M12 17v2"/>',
 run:'<circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v4M7 12l3-4 4 1 2 3h3M11 8l-1 5"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
 upload:'<path d="M12 21V9M7 14l5-5 5 5M4 3h16"/>',
 refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'
};
const svg=(n,a='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${a}>${I[n]||''}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}

/* ========== ESTADO ========== */
const KEY='pfe_v1';
const DEF=()=>({v:1,setup:false,family:'',days:14,households:[],persons:[],plan:{},contacts:[],done:{},exp:{},review:null,theme:'auto'});
let ST=DEF();
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&typeof j==='object')ST=Object.assign(DEF(),j)}catch(e){}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){toast('No se pudo guardar en este navegador')}},200)}
function applyTheme(){const r=document.documentElement;if(ST.theme==='light')r.setAttribute('data-theme','light');else r.removeAttribute('data-theme');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=ST.theme==='light'?'#f3f6fb':'#0a1220'}

/* ========== CÁLCULOS ========== */
const JUG=18.9; // garrafón de 5 galones
const fmt=(n,d=1)=>{const v=Math.round(n*10**d)/10**d;return v.toLocaleString('es-PA')};
const totalPeople=()=>ST.households.reduce((a,h)=>a+(+h.people||0),0);
const anyCar=()=>ST.households.some(h=>h.car);
const sumOf=k=>ST.households.reduce((a,h)=>a+(+h[k]||0),0);

function bagItems(){
 const n=totalPeople();const L=[
 ['b_agua',`Agua potable: mínimo 2 L por persona en la mochila`,1],
 ['b_comida','Alimentos listos para comer: enlatados, barras, galletas, frutos secos',1],
 ['b_abrelatas','Abrelatas manual'],
 ['b_ropa','Muda de ropa, ropa interior y chaqueta impermeable'],
 ['b_calzado','Calzado resistente y cerrado'],
 ['b_linterna','Linterna con pilas de repuesto',1],
 ['b_botiquin','Botiquín: vendas, gasas, antiséptico, curitas'],
 ['b_meds','Medicamentos personales para 3 días o más',1],
 ['b_docs','Copias de cédula y documentos clave en bolsa hermética'],
 ['b_contactos','Lista de contactos de emergencia en papel'],
 ['b_power','Power bank cargado y cable del celular'],
 ['b_radio','Radio a pilas o de manivela'],
 ['b_higiene','Higiene: papel, jabón, toallas húmedas, gel'],
 ['b_mascarillas','Mascarillas y guantes'],
 ['b_silbato','Silbato para pedir ayuda'],
 ['b_manta','Manta térmica o cobija ligera'],
 ['b_efectivo','Efectivo en billetes pequeños'],
 ['b_llaves','Copia de llaves de casa y carro'],
 ['b_bolsas','Bolsas plásticas y de basura'],
 ['b_fuego','Encendedor o fósforos en bolsa impermeable'],

 <label class="f"><span>Casa</span><select class="in" id="pH">${ST.households.map(h=>`<option value="${h.id}" ${h.id===p.hh?'selected':''}>${esc(h.name||'Casa')}</option>`).join('')}</select></label>

function planText(){
 const P=ST.plan;const L=[];
 L.push(`🛡️ PLAN DE EMERGENCIA — ${ST.family||'Mi familia'}`);
 L.push('');
 PLAN_FIELDS.forEach(([k,l])=>{if(P[k])L.push(`• ${l}: ${P[k]}`)});
 if(ST.households.length){L.push('');L.push('🏠 Casas:');ST.households.forEach(h=>L.push(`• ${h.name||'Casa'}: ${+h.people||0} persona(s)`))}
 if(ST.persons.length){L.push('');L.push('👥 Personas:');ST.persons.forEach(p=>{const hh=ST.households.find(x=>x.id===p.hh);L.push(`• ${p.name}${hh?' ('+hh.name+')':''}${p.phone?' — '+p.phone:''}${p.needs?' — '+p.needs:''}`)})}
 L.push('');L.push('☎️ Emergencias: 911 · Bomberos y ambulancia 103 · Policía 104');
 return L.join('\n');
}

 window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

 let h=`<h1>Plan de emergencia — ${esc(ST.family||'Mi familia')}</h1><div>Actualizado: ${new Date().toLocaleDateString('es-PA')}</div>`;
 h+=`<h2>Plan de comunicación</h2>`+tbl(PLAN_FIELDS.map(([k,l])=>[esc(l),esc(P[k]||'')]));
 h+=`<h2>Personas</h2>`+tbl(ST.persons.map(p=>{const hh=ST.households.find(x=>x.id===p.hh);return[esc(p.name),esc(hh?hh.name:''),esc(p.phone),esc(p.needs)]}),['Nombre','Casa','Teléfono','Medicinas / necesidades']);
 h+=`<h2>Teléfonos</h2>`+tbl(OFFICIAL.map(([n,t])=>[esc(t),n]).concat(ST.contacts.map(c=>[esc(c.name+(c.rel?' ('+c.rel+')':'')),esc(c.phone)])),['Contacto','Número']);
 sections().forEach(s=>{h+=`<h2 class="pb">${esc(s.name)}</h2>`+tbl(s.items.map(it=>[`<span class="box"></span>`,esc(it.t)+(it.q?' — <b>'+esc(it.q)+'</b>':''),it.e?esc(ST.exp[it.id]||''):'']),['✓','Elemento','Vence'])});
 $('#print').innerHTML=h;setTimeout(()=>window.print(),50);
}
function exportData(){
 if(NATIVE()){try{window.Android.share(JSON.stringify({app:'plan-familiar-emergencia',date:new Date().toISOString(),data:ST}))}catch(e){}return}
 const blob=new Blob([JSON.stringify({app:'plan-familiar-emergencia',date:new Date().toISOString(),data:ST},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plan-emergencia-'+todayISO()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importData(){
 const f=$('#fpick');f.value='';f.onchange=async()=>{try{const j=JSON.parse(await f.files[0].text());const d=j.data||j;if(!d||!Array.isArray(d.households))throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;ST=Object.assign(DEF(),d);save();go({name:'home'},true);toast('Respaldo importado')}catch(e){toast('El archivo no es un respaldo válido')}};f.click();
}
async function checkUpdate(){
 try{if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}}catch(e){}
 location.reload();
}

/* ========== EVENTOS ========== */
function bind(){
 const app=$('#app');
 app.onclick=e=>{
  const el=e.target.closest('button,[data-go],[data-gokit]');if(!el)return;const d=el.dataset;
  if('back' in d){history.length>1?history.back():go({name:'home'},true);return}
  if(d.go){go({name:d.go});return}
  if(d.gokit){go({name:'kit',tab:d.gokit});return}
  if('tosv' in d){location.href='../index.html';return}
  if(d.book){toSurvival('open='+d.book);return}
  if(d.ask){toSurvival('ask='+encodeURIComponent(d.ask));return}
  if(d.tab2){go({name:'kit',tab:d.tab2},true);return}
  if(d.guide){go({name:'guide',id:d.guide});return}
  if(d.chk){ST.done[d.chk]?delete ST.done[d.chk]:ST.done[d.chk]=true;save();keepScroll(render);return}
  if(d.person){personEditor(ST.persons.find(p=>p.id===d.person));return}
  if(d.cedit){e.preventDefault();contactEditor(ST.contacts.find(c=>c.id===d.cedit));return}
  if(d.hstep){const hh=ST.households.find(x=>x.id===el.closest('[data-hh]').dataset.hh);hh[d.hstep]=Math.max(+d.min,(+hh[d.hstep]||0)+(+d.d));save();keepScroll(render);return}
  if(d.hdel){if(confirm('¿Quitar esta casa? Se pierden sus marcas.')){ST.households=ST.households.filter(x=>x.id!==d.hdel);ST.persons.forEach(p=>{if(p.hh===d.hdel)p.hh=ST.households[0]?.id});save();keepScroll(render)}return}
  switch(el.id){
   case 'hhAdd':ST.households.push({id:uid(),name:`Casa ${ST.households.length+1}`,people:1,babies:0,elderly:0,pets:0,car:false});save();keepScroll(render);return;
   case 'wizDone':ST.setup=true;ST.households.forEach((h,i)=>{if(!h.name.trim())h.name=`Casa ${i+1}`});save();go({name:'home'},true);return;
   case 'shareBtn':sharePlan();return;
   case 'printBtn':printAll();return;
   case 'reviewBtn':ST.review=todayISO();save();toast('Revisión registrada');render();return;
   case 'personAdd':personEditor();return;
   case 'contactAdd':contactEditor();return;
   case 'expBtn':exportData();return;
   case 'impBtn':importData();return;
   case 'updBtn':checkUpdate();return;
   case 'wipeBtn':if(confirm('¿Borrar todos los datos del plan en este teléfono?')&&confirm('Esta acción no se puede deshacer. ¿Seguro?')){ST=DEF();save();go({name:'home'},true)}return;
  }
 };
 app.querySelectorAll('[data-st]').forEach(el=>{el.onchange=el.oninput=()=>{const k=el.dataset.st;ST[k]=k==='days'?+el.value:el.value;save();if(k==='theme'||k==='days')keepScroll(render)}});
 app.querySelectorAll('[data-hf]').forEach(el=>{const hh=()=>ST.households.find(x=>x.id===el.closest('[data-hh]').dataset.hh);
  if(el.type==='checkbox')el.onchange=()=>{hh().car=el.checked;save()};else el.oninput=()=>{hh().name=el.value;save()}});
 app.querySelectorAll('[data-plan]').forEach(el=>{el.oninput=()=>{const v=el.value;v.trim()?ST.plan[el.dataset.plan]=v:delete ST.plan[el.dataset.plan];save()}});
 app.querySelectorAll('[data-exp]').forEach(el=>{el.onchange=()=>{el.value?ST.exp[el.dataset.exp]=el.value:delete ST.exp[el.dataset.exp];save();keepScroll(render)}});
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="tel:"]');if(a&&window.Android&&typeof window.Android.dial==='function'){e.preventDefault();try{window.Android.dial(a.getAttribute('href').slice(4))}catch(err){}}},true);
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;const t=b.dataset.tab;if(VIEW.name===t)return;go({name:t})};

/* ========== INICIO ========== */
load();
migrateFromSurvival();
try{history.replaceState({name:'home'},'')}catch(e){}
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
